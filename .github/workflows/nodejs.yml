name: Node.js CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional mocha grep pattern; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [18.x, 19.x, 20.x, 21.x, 22.x, 23.x, 24.x, 25.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build --if-present
      - run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run clean && npx tsc && npx mocha --grep "${{ inputs.test-filter }}"
          else
            npm test
          fi

  pack:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.10.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - run: npm ci
      - run: npm i -g npm@11.6.2
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: basic-ftp-tgz
          path: basic-ftp-5.2.0.tgz
          if-no-files-found: error
